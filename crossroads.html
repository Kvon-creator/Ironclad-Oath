<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ironclad Oath - Web Tactical Prototype</title>
  <style>
    :root {
      --bg: #121417;
      --panel-bg: #1c2128;
      --border: #3b4252;
      --text: #eceff4;
      --accent: #d08770;
      --player: #88c0d0;
      --enemy: #bf616a;
      --bloom: #a3be8c;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 1.4rem; color: #e5e9f0; }
    #game-container {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }
    canvas {
      border: 3px solid var(--border);
      background-color: #2e3440;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }
    #sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      padding: 12px;
      border-radius: 4px;
    }
    .panel h3 { margin: 0 0 8px 0; font-size: 1rem; color: var(--accent); }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      background: #2e3440;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover:not(:disabled) { background: #434c5e; border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #log-box {
      height: 140px;
      overflow-y: auto;
      font-size: 0.75rem;
      line-height: 1.2;
      background: #0f1115;
      padding: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <h1>IRONCLAD OATH (Tactical Web Preview)</h1>

  <div id="game-container">
    <canvas id="battleCanvas" width="400" height="400"></canvas>

    <div id="sidebar">
      <div class="panel" id="unit-card">
        <h3>Unit Intel</h3>
        <div id="unit-info">Click a unit on the grid...</div>
      </div>

      <div class="panel">
        <h3>Action Deck</h3>
        <div class="btn-group">
          <button id="btn-move" disabled>Move</button>
          <button id="btn-attack" disabled>Strike</button>
          <button id="btn-rest" disabled>Rest (+3 Fat)</button>
          <button id="btn-face" disabled>Set Facing</button>
        </div>
        <button id="btn-end-turn" style="width: 100%; margin-top: 8px;">End Turn Phase</button>
      </div>

      <div class="panel">
        <h3>Battlefield Log</h3>
        <div id="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    const TILE_SIZE = 40;
    const GRID_SIZE = 10;
    const canvas = document.getElementById("battleCanvas");
    const ctx = canvas.getContext("2d");

    // Directions: North, East, South, West
    const DIRS = {
      NORTH: { dx: 0, dy: -1, glyph: "▲", name: "NORTH" },
      EAST:  { dx: 1, dy: 0,  glyph: "▶", name: "EAST" },
      SOUTH: { dx: 0, dy: 1,  glyph: "▼", name: "SOUTH" },
      WEST:  { dx: -1, dy: 0, glyph: "◀", name: "WEST" }
    };

    const bloomTiles = [{x: 1, y: 3}, {x: 1, y: 4}, {x: 2, y: 3}, {x: 2, y: 4}, {x: 2, y: 5}];
    const ruinTiles  = [{x: 4, y: 4}, {x: 5, y: 4}];

    let units = [
      { id: "P1", name: "Vanguard Knight", faction: "PLAYER", x: 4, y: 8, facing: DIRS.NORTH, hp: 45, maxHp: 45, fatigue: 0, maxFat: 30, poise: 40, maxPoise: 40, atk: 14, range: 1, armor: {FRONT: 50, FLANK: 30, REAR: 15}, shield: true, moved: false, acted: false, done: false },
      { id: "P2", name: "Hedge Halberdier", faction: "PLAYER", x: 5, y: 8, facing: DIRS.NORTH, hp: 38, maxHp: 38, fatigue: 0, maxFat: 25, poise: 30, maxPoise: 30, atk: 16, range: 2, armor: {FRONT: 35, FLANK: 20, REAR: 10}, spear: true, moved: false, acted: false, done: false },
      { id: "P3", name: "Outrider Scout", faction: "PLAYER", x: 6, y: 9, facing: DIRS.NORTH, hp: 28, maxHp: 28, fatigue: 0, maxFat: 20, poise: 18, maxPoise: 18, atk: 11, range: 3, armor: {FRONT: 15, FLANK: 10, REAR: 5}, moved: false, acted: false, done: false },
      { id: "E1", name: "Footman A", faction: "ENEMY", x: 4, y: 2, facing: DIRS.SOUTH, hp: 35, maxHp: 35, fatigue: 0, maxFat: 25, poise: 25, maxPoise: 25, atk: 12, range: 1, armor: {FRONT: 30, FLANK: 20, REAR: 10}, shield: true },
      { id: "E2", name: "Footman B", faction: "ENEMY", x: 5, y: 2, facing: DIRS.SOUTH, hp: 35, maxHp: 35, fatigue: 0, maxFat: 25, poise: 25, maxPoise: 25, atk: 12, range: 1, armor: {FRONT: 30, FLANK: 20, REAR: 10}, shield: true },
      { id: "ET", name: "Bloom Thrall", faction: "ENEMY", x: 1, y: 2, facing: DIRS.SOUTH, hp: 55, maxHp: 55, fatigue: 0, maxFat: 40, poise: 60, maxPoise: 60, atk: 17, range: 1, armor: {FRONT: 15, FLANK: 15, REAR: 15}, afflicted: true }
    ];

    let selectedUnit = null;
    let actionMode = null; // 'MOVE', 'ATTACK', 'FACING'

    function log(msg) {
      const b = document.getElementById("log-box");
      b.innerHTML += `<div>${msg}</div>`;
      b.scrollTop = b.scrollHeight;
    }

    function getUnitAt(x, y) {
      return units.find(u => u.hp > 0 && u.x === x && u.y === y);
    }

    function isBloom(x, y) {
      return bloomTiles.some(t => t.x === x && t.y === y);
    }

    function isRuin(x, y) {
      return ruinTiles.some(t => t.x === x && t.y === y);
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          let px = x * TILE_SIZE;
          let py = y * TILE_SIZE;

          // Base tile
          ctx.fillStyle = (x + y) % 2 === 0 ? "#282c34" : "#21252b";
          if (isBloom(x, y)) ctx.fillStyle = "#2f4f3e"; // Bloom spore tint
          if (isRuin(x, y)) ctx.fillStyle = "#4c566a";  // Stone ruins
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

          // Grid lines
          ctx.strokeStyle = "#3b4252";
          ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
        }
      }

      // Draw Units
      units.filter(u => u.hp > 0).forEach(u => {
        let px = u.x * TILE_SIZE;
        let py = u.y * TILE_SIZE;

        // Base icon
        ctx.fillStyle = u.faction === "PLAYER" ? "#5e81ac" : (u.afflicted ? "#a3be8c" : "#bf616a");
        ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

        // Highlight selection
        if (selectedUnit === u) {
          ctx.strokeStyle = "#ebcb8b";
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
          ctx.lineWidth = 1;
        }

        // Unit ID & Facing indicator
        ctx.fillStyle = "#eceff4";
        ctx.font = "12px Courier New";
        ctx.fillText(u.id, px + 8, py + 18);
        ctx.font = "14px Courier New";
        ctx.fillText(u.facing.glyph, px + 24, py + 18);

        // Mini HP Bar
        let hpPct = Math.max(0, u.hp / u.maxHp);
        ctx.fillStyle = "#4c566a";
        ctx.fillRect(px + 4, py + TILE_SIZE - 8, TILE_SIZE - 8, 4);
        ctx.fillStyle = "#a3be8c";
        ctx.fillRect(px + 4, py + TILE_SIZE - 8, (TILE_SIZE - 8) * hpPct, 4);
      });
    }

    function calculateFacing(attacker, defender) {
      let dx = attacker.x - defender.x;
      let dy = attacker.y - defender.y;
      let approach = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? DIRS.EAST : DIRS.WEST)
        : (dy > 0 ? DIRS.SOUTH : DIRS.NORTH);

      if (approach === defender.facing) return { angle: "FRONT", mult: 1.0, slot: "FRONT" };
      if (approach.dx === -defender.facing.dx && approach.dy === -defender.facing.dy) return { angle: "REAR", mult: 1.75, slot: "REAR" };
      return { angle: "FLANK", mult: 1.25, slot: "FLANK" };
    }

    function executeAttack(attacker, defender) {
      let res = calculateFacing(attacker, defender);
      let rawDmg = attacker.atk * res.mult;
      let arm = defender.armor[res.slot];
      let unmitigated = (res.angle === "REAR") ? (rawDmg * 0.75) : Math.max(2, rawDmg - (arm * 0.65));

      defender.armor[res.slot] = Math.max(0, defender.armor[res.slot] - 6);
      defender.hp = Math.max(0, defender.hp - unmitigated);
      attacker.fatigue = Math.min(attacker.maxFat, attacker.fatigue + 4);

      log(`<b>${attacker.id}</b> struck <b>${defender.id}</b> (${res.angle}) for ${unmitigated.toFixed(1)} DMG!`);
      if (defender.hp <= 0) log(`💀 <b>${defender.id}</b> has fallen!`);
      updateCard();
      drawGrid();
    }

    function updateCard() {
      const box = document.getElementById("unit-info");
      if (!selectedUnit) {
        box.innerHTML = "Click a unit to view parameters.";
        return;
      }
      const u = selectedUnit;
      box.innerHTML = `
        <strong>${u.name} [${u.id}]</strong><br>
        HP: ${u.hp.toFixed(1)}/${u.maxHp} | Fat: ${u.fatigue}/${u.maxFat}<br>
        Poise: ${u.poise}/${u.maxPoise} | Facing: ${u.facing.name}<br>
        Armor: F:${u.armor.FRONT} S:${u.armor.FLANK} R:${u.armor.REAR}
      `;
      document.getElementById("btn-move").disabled = (u.faction !== "PLAYER" || u.moved || u.done);
      document.getElementById("btn-attack").disabled = (u.faction !== "PLAYER" || u.acted || u.done);
      document.getElementById("btn-rest").disabled = (u.faction !== "PLAYER" || u.acted || u.done);
      document.getElementById("btn-face").disabled = (u.faction !== "PLAYER" || u.done);
    }

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const gx = Math.floor((e.clientX - rect.left) / TILE_SIZE);
      const gy = Math.floor((e.clientY - rect.top) / TILE_SIZE);

      if (actionMode === 'MOVE' && selectedUnit) {
        let dist = Math.abs(selectedUnit.x - gx) + Math.abs(selectedUnit.y - gy);
        if (dist === 1 && !getUnitAt(gx, gy) && !isRuin(gx, gy)) {
          selectedUnit.x = gx;
          selectedUnit.y = gy;
          selectedUnit.fatigue += (isBloom(gx, gy) ? 2 : 1);
          selectedUnit.moved = true;
          log(`${selectedUnit.id} repositioned to (${gx}, ${gy}).`);
        }
        actionMode = null;
        updateCard();
        drawGrid();
        return;
      }

      if (actionMode === 'ATTACK' && selectedUnit) {
        let target = getUnitAt(gx, gy);
        if (target && target.faction !== selectedUnit.faction) {
          let dist = Math.abs(selectedUnit.x - target.x) + Math.abs(selectedUnit.y - target.y);
          if (dist <= selectedUnit.range) {
            executeAttack(selectedUnit, target);
            selectedUnit.acted = true;
          }
        }
        actionMode = null;
        updateCard();
        return;
      }

      // Default: selection
      let clicked = getUnitAt(gx, gy);
      if (clicked) {
        selectedUnit = clicked;
        updateCard();
        drawGrid();
      }
    });

    document.getElementById("btn-move").onclick = () => { actionMode = 'MOVE'; log("Click an adjacent tile to step."); };
    document.getElementById("btn-attack").onclick = () => { actionMode = 'ATTACK'; log("Click a hostile within range."); };
    document.getElementById("btn-rest").onclick = () => {
      if (selectedUnit) {
        selectedUnit.fatigue = Math.max(0, selectedUnit.fatigue - 3);
        selectedUnit.acted = true;
        log(`${selectedUnit.id} catches breath (-3 Fatigue).`);
        updateCard();
      }
    };
    document.getElementById("btn-face").onclick = () => {
      if (selectedUnit) {
        let order = [DIRS.NORTH, DIRS.EAST, DIRS.SOUTH, DIRS.WEST];
        let idx = order.indexOf(selectedUnit.facing);
        selectedUnit.facing = order[(idx + 1) % 4];
        selectedUnit.done = true;
        log(`${selectedUnit.id} finished turn facing ${selectedUnit.facing.name}.`);
        updateCard();
        drawGrid();
      }
    };

    document.getElementById("btn-end-turn").onclick = () => {
      log("--- ENEMY PHASE ---");
      units.filter(u => u.faction === "ENEMY" && u.hp > 0).forEach(e => {
        let players = units.filter(p => p.faction === "PLAYER" && p.hp > 0);
        if (players.length === 0) return;
        let target = players[0];
        let dist = Math.abs(e.x - target.x) + Math.abs(e.y - target.y);
        if (dist <= e.range) {
          executeAttack(e, target);
        }
      });
      // Refresh Player Units
      units.filter(u => u.faction === "PLAYER").forEach(u => {
        u.moved = false;
        u.acted = false;
        u.done = false;
      });
      log("--- PLAYER TURN ---");
      updateCard();
      drawGrid();
    };

    drawGrid();
    log("Web engine initialized. Click Vanguard [P1] to command.");
  </script>
</body>
</html>
